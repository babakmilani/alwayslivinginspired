name: Weekly Fashion Article Generator

on:
  schedule:
    # Runs every Monday at 8:00 AM EST (13:00 UTC)
    - cron: '0 13 * * 1'
  workflow_dispatch: # Manual trigger for testing

permissions:
  contents: write

jobs:
  generate-article:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          npm ci || npm install
          npm install @anthropic-ai/sdk cheerio

      # 4. Generate the fashion article
      - name: Generate Fashion Article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-article.js

      # 5. Commit & push (rebase first so we never race a manual push)
      - name: Commit and Push new article
        run: |
          git config --global user.name "Always Living Inspired Bot"
          git config --global user.email "action@github.com"

          git add public/blogs/*.html || true
          git add public/blogs/articles.json || true
          git add article-report.txt .article-title.txt || true

          if git diff --cached --quiet; then
            echo "No new article to commit."
            exit 0
          fi

          ARTICLE_TITLE=$(cat .article-title.txt 2>/dev/null || echo "Weekly Fashion Article")
          git commit -m "Auto-generated fashion article: ${ARTICLE_TITLE}"

          # Integrate anything pushed since checkout, then push.
          # --autostash handles the package-lock churn from npm install.
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      # 6. Display report
      - name: Display Article Report
        if: always()
        run: |
          if [ -f article-report.txt ]; then
            echo "----------------------------------------------"
            cat article-report.txt
            echo "----------------------------------------------"
          else
            echo "No article-report.txt found."
          fi